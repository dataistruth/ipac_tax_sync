[project]
name = "ipac-delta-sync"
version = "0.1.0"
description = "JSON-config-driven Lakeflow Connect scaffolding (run from repo root, not installed as a package)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "mssql-python>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
