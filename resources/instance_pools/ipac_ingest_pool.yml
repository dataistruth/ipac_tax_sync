# Dedicated instance pools for ingest pipelines and SQL recon cluster.
# Both pools must live in one file — separate files overwrite instance_pools on merge.
resources:
  instance_pools:
    ipac_ingest_pool:
      instance_pool_name: ipac_delta_sync_ingest_dedicated_pool
      node_type_id: ${var.pipeline_instance_pool_node_type}
      min_idle_instances: ${var.pipeline_instance_pool_min_idle}
      max_capacity: ${var.pipeline_instance_pool_max_capacity}
      idle_instance_autotermination_minutes: 30
      azure_attributes:
        availability: ON_DEMAND_AZURE
      preloaded_spark_versions:
        - ${var.pipeline_spark_version}
      permissions:
        - level: CAN_ATTACH_TO
          group_name: ${var.grant_group}
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
    ipac_recon_pool:
      instance_pool_name: ipac_delta_sync_recon_dedicated_pool
      node_type_id: ${var.pipeline_instance_pool_node_type}
      min_idle_instances: ${var.sql_recon_instance_pool_min_idle}
      max_capacity: ${var.sql_recon_instance_pool_max_capacity}
      idle_instance_autotermination_minutes: 30
      azure_attributes:
        availability: ON_DEMAND_AZURE
      preloaded_spark_versions:
        - ${var.sql_recon_spark_version}
      permissions:
        - level: CAN_ATTACH_TO
          group_name: ${var.grant_group}
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
