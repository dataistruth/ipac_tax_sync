# Shared cluster for SQL Server CT recon notebooks + continuous recon job.
# SQL connectivity: mssql-python + pydantic v2 installed via %pip in run_ingestion_recon.py (no init script).

resources:
  clusters:
    ipac_sql_recon_cluster:
      cluster_name: ipac_sql_recon_shared
      spark_version: ${var.sql_recon_spark_version}
      node_type_id: ${var.sql_recon_node_type_id}
      num_workers: 0
      spark_conf:
        spark.databricks.cluster.profile: singleNode
        spark.master: local[32]
      custom_tags:
        bundle: ${var.job_tag}
        purpose: sql_recon
        ResourceClass: SingleNode
      data_security_mode: USER_ISOLATION
      runtime_engine: STANDARD
      autotermination_minutes: ${var.sql_recon_autotermination_minutes}
      enable_elastic_disk: true
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
        - level: CAN_RESTART
          group_name: ${var.grant_group}
        - level: CAN_ATTACH_TO
          group_name: ${var.grant_group}
