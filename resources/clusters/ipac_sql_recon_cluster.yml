# Dedicated SQL Server CT recon cluster — single D64 from ipac_recon_pool (SINGLE_USER, no autoscale).

resources:
  clusters:
    ipac_sql_recon_cluster:
      cluster_name: ipac_sql_recon_dedicated
      spark_version: ${var.sql_recon_spark_version}
      instance_pool_id: ${resources.instance_pools.ipac_recon_pool.id}
      driver_instance_pool_id: ${resources.instance_pools.ipac_recon_pool.id}
      num_workers: ${var.pipeline_cluster_num_workers}
      spark_conf:
        spark.databricks.cluster.profile: singleNode
        spark.master: ${var.cluster_spark_master}
      custom_tags:
        bundle: ${var.job_tag}
        purpose: sql_recon
        ResourceClass: SingleNode
      data_security_mode: ${var.cluster_data_security_mode}
      single_user_name: ${var.dedicated_compute_principal}
      runtime_engine: STANDARD
      autotermination_minutes: ${var.sql_recon_autotermination_minutes}
      enable_elastic_disk: true
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
        - level: CAN_RESTART
          group_name: ${var.grant_group}
        - level: CAN_ATTACH_TO
          group_name: ${var.grant_group}
