# Generated by ipac-delta-sync from cluster_config.json tier j2 (recon_cluster_tier).
# Fixed single-node j2 D32 job cluster — NOT serverless (on-prem SQL Server).
# Regenerate: ipac-delta-sync generate
resources:
  jobs:
    ingestion_recon_monitor:
      name: j_ipac_delta_sync_ingestion_recon_monitor
      max_concurrent_runs: 1
      timeout_seconds: 0
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
      tags:
        bundle: ${var.job_tag}
      email_notifications:
        on_failure:
          - ${var.heartbeat_job_alert_mail}
      continuous:
        pause_status: UNPAUSED
      job_clusters:
        - job_cluster_key: recon_j2
          new_cluster:
            node_type_id: Standard_D32s_v3
            spark_version: ${var.pipeline_spark_version}
            num_workers: ${var.pipeline_cluster_num_workers}
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[32]
            custom_tags:
              ResourceClass: SingleNode
              bundle: ${var.job_tag}
              purpose: sql_recon
      tasks:
        - task_key: run_ingestion_recon
          job_cluster_key: recon_j2
          notebook_task:
            notebook_path: ${workspace.file_path}/src/common/notebooks/run_ingestion_recon.py
            base_parameters:
              uc_catalog: ${resources.schemas.schema_ipac_metadata.catalog_name}
              ipac_metadata_schema: ${resources.schemas.schema_ipac_metadata.name}
              pipeline_names_file: ${workspace.file_path}/generated/config/pipeline_names.json
              dest_schema_suffix: ${var.dest_schema_suffix}
              poll_interval_sec: ${var.recon_poll_interval_sec}
