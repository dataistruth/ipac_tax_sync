resources:
  jobs:
    pipeline_heartbeat_monitor:
      name: ipac_delta_sync_pipeline_heartbeat_monitor
      max_concurrent_runs: 1
      timeout_seconds: 0
      email_notifications:
        on_failure:
          - usa-mukessingh@deloitte.com
      schedule:
        quartz_cron_expression: "0 */10 * * * ?"
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      tasks:
        - task_key: monitor_continuous_pipelines
          spark_python_task:
            python_file: ${workspace.file_path}/src/common/ops/monitor_pipeline_heartbeat.py
            parameters:
              - --name-prefix
              - p_
              - --heartbeat-interval-sec
              - ${var.heartbeat_interval_sec}
          environment_key: monitor_env
      environments:
        - environment_key: monitor_env
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.39.0

    pipeline_failed_restart:
      name: ipac_delta_sync_pipeline_failed_restart
      max_concurrent_runs: 1
      timeout_seconds: 0
      email_notifications:
        on_failure:
          - usa-mukessingh@deloitte.com
      tasks:
        - task_key: restart_failed_continuous_pipelines
          spark_python_task:
            python_file: ${workspace.file_path}/src/common/ops/restart_failed_pipelines.py
            parameters:
              - --name-prefix
              - p_
              - --restart-limit
              - "25"
          environment_key: monitor_env
      environments:
        - environment_key: monitor_env
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.39.0
