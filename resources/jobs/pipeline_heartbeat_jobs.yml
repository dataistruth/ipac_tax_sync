resources:
  jobs:
    pipeline_heartbeat_monitor:
      name: ipac_delta_sync_pipeline_heartbeat_monitor
      max_concurrent_runs: 1
      timeout_seconds: 0
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
      tags:
        bundle: ${var.job_tag}
      email_notifications:
        on_failure:
          - ${var.heartbeat_job_alert_mail}
      # Continuous job polls pipeline status every heartbeat_interval_sec (see notebook loop).
      # pause_status UNPAUSED overrides dev-mode default pause on triggers.
      continuous:
        pause_status: UNPAUSED
      tasks:
        - task_key: monitor_continuous_pipelines
          notebook_task:
            notebook_path: ${workspace.file_path}/src/common/notebooks/monitor_pipeline_heartbeat.py
            base_parameters:
              name_prefix: p_
              heartbeat_interval_sec: ${var.heartbeat_interval_sec}
              pipeline_names_file: ${workspace.file_path}/generated/config/pipeline_names.json
              uc_catalog: ${var.uc_catalog}
              ipac_metadata_schema: ${var.ipac_metadata_schema}

    pipeline_failed_restart:
      name: ipac_delta_sync_pipeline_failed_restart
      max_concurrent_runs: 1
      timeout_seconds: 0
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
      tags:
        bundle: ${var.job_tag}
      email_notifications:
        on_failure:
          - ${var.heartbeat_job_alert_mail}
      tasks:
        - task_key: restart_failed_continuous_pipelines
          notebook_task:
            notebook_path: ${workspace.file_path}/src/common/notebooks/restart_failed_pipelines.py
            base_parameters:
              name_prefix: p_
              restart_limit: "25"
              pipeline_names_file: ${workspace.file_path}/generated/config/pipeline_names.json
