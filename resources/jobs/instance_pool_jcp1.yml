# Shared warm pool for all Lakeflow Connect pipeline clusters (D16s_v3).
# Included via resources/jobs/*.yml — each pipeline uses ${resources.instance_pools.jcp1.id}.
resources:
  instance_pools:
    jcp1:
      instance_pool_name: ipac_lakeflow_jcp1
      node_type_id: ${var.instance_pool_node_type_id}
      min_idle_instances: ${var.instance_pool_min_idle_instances}
      max_capacity: ${var.instance_pool_max_capacity}
      preloaded_spark_versions:
        - ${var.pipeline_spark_version}
      custom_tags:
        bundle: ${var.pipeline_tag}
        purpose: lakeflow_connect
