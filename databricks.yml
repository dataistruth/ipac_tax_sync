# =============================================================================
# ipac_delta_sync — JSON-config-driven Lakeflow Connect scaffolding
#
# Workflow:
#   1. Edit config/common/client.json, common_tables.json, client_overrides/
#   2. Set uc_catalog below (common for all clients / targets)
#   3. ./ipac-delta-sync validate
#   4. ./ipac-delta-sync generate
#   5. First deploy: databricks bundle validate && databricks bundle deploy
#      (order: generated/config/schema → instance pool → pipelines → jobs)
#   6. Later: databricks bundle deploy --select pipelines.p_<client_nm>_1,...
#
# Calc jobs deploy from ipac-sdt-calc (jobs.*) — see docs/migration-from-ipac-core-sdt.md
# =============================================================================
bundle:
  name: ipac-delta-sync
  engine: direct

# Shared UC schemas (ipac_metadata, client raw) use stable names — no [dev user] prefix.
experimental:
  skip_name_prefix_for_schema: true

sync:
  include:
    - src/common/notebooks/**
    - src/common/ops/**
    - generated/config/**

include:
  # Deploy order: UC schemas → instance pool → pipelines → ops jobs
  - generated/config/schema/*.yml
  - resources/instance_pools/*.yml
  - generated/bundle/*.yml
  - resources/jobs/*.yml

variables:
  uc_catalog:
    default: ipac_tax_synch
    description: Common UC catalog for all clients
  dest_schema_suffix:
    default: "_poc1"
    description: Suffix appended to client_nm for raw schema ({client_nm}{suffix}, e.g. _poc1)
  uc_lkf_staging_schema:
    default: ""
    description: Pipeline-level Lakeflow staging schema (${var.uc_lkf_staging_schema}); table destination_schema remains per-client
  ipac_metadata_schema:
    default: ipac_metadata
    description: Metadata schema for process logs and heartbeat status tables
  grant_group:
    default: ipacs_dev_team
    description: Databricks group granted manage/view access on generated pipelines and jobs
  heartbeat_interval_sec:
    default: 900
    description: Poll interval (seconds) for heartbeat monitor job and max allowed heartbeat age for continuous pipelines
  recon_poll_interval_sec:
    default: 300
    description: Poll interval (seconds) for ingestion flow metrics reconciliation job
  recon_lookback_hours:
    default: 24
    description: Hours of ingestion event log history to scan each recon poll
  heartbeat_job_alert_mail:
    default: mukessingh@deloitte.com
    description: Email recipient for heartbeat monitor/restart job failures
  num_of_tables_in_pipeline:
    default: 10
    description: Max tables per generated Lakeflow pipeline (split into p_<client_nm>_1, _2, ...). Keep low (5–20) to avoid driver GC pressure on continuous ingest.
  pipeline_tag:
    default: ipac_delta_sync
    description: Tag value applied to all generated Lakeflow pipelines (tags.bundle)
  job_tag:
    default: ipac_delta_sync
    description: Tag value applied to bundle jobs (tags.bundle)
  pipeline_max_update_retry_attempts:
    default: 2
    description: Max update retries after failure for continuous Lakeflow pipelines (pipelines.numUpdateRetryAttempts)
  pipeline_cluster_node_type:
    default: Standard_DS3_v2
    description: Deprecated fallback when instance pool is disabled (prefer pipeline_instance_pool_node_type)
  pipeline_instance_pool_node_type:
    default: Standard_D32s_v3
    description: Azure D-series node type for shared ingest instance pool (32 vCPU)
  pipeline_instance_pool_min_idle:
    default: 4
    description: Minimum idle VMs kept warm in the shared ingest instance pool
  pipeline_instance_pool_max_capacity:
    default: 8
    description: Maximum outstanding VMs in the shared ingest instance pool (idle + in-use)
  pipeline_spark_version:
    default: 15.4.x-scala2.12
    description: Spark runtime for generated Lakeflow pipeline clusters and pool preload

targets:
  # Deploy with: databricks bundle deploy -t dev
  # Target "dev" = your environment (catalog dev7). It is NOT bundle development mode.
  # mode: production on this target means:
  #   - no [dev username] prefix on pipeline/job/pool names
  #   - no "dev" custom tag on pools (required for instance_pool_id)
  # pipelines_development: false + generated YAML development: false
  dev:
    default: true
    mode: production
    presets:
      pipelines_development: false
    variables:
      uc_catalog: dev7
      dest_schema_suffix: "_poc1"
      ipac_metadata_schema: ipac_metadata
      grant_group: ipacs_dev_team
      heartbeat_interval_sec: 900
      recon_poll_interval_sec: 300
      recon_lookback_hours: 24
      heartbeat_job_alert_mail: mukessingh@deloitte.com
      pipeline_tag: ipac_delta_sync
      job_tag: ipac_delta_sync
      pipeline_max_update_retry_attempts: 2
      num_of_tables_in_pipeline: 10
      pipeline_instance_pool_node_type: Standard_D32s_v3
      pipeline_instance_pool_min_idle: 4
      pipeline_instance_pool_max_capacity: 8

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/ipac_delta_sync/prod
    variables:
      uc_catalog: ipac_tax_synch
      dest_schema_suffix: "_poc1"
      ipac_metadata_schema: ipac_metadata
      grant_group: ipacs_dev_team
      heartbeat_interval_sec: 900
      recon_poll_interval_sec: 300
      recon_lookback_hours: 24
      heartbeat_job_alert_mail: mukessingh@deloitte.com
      pipeline_tag: ipac_delta_sync
      job_tag: ipac_delta_sync
      pipeline_max_update_retry_attempts: 2
      pipeline_instance_pool_node_type: Standard_D32s_v3
      pipeline_instance_pool_min_idle: 4
      pipeline_instance_pool_max_capacity: 8

