# =============================================================================
# ipac_delta_sync — Lakeflow Connect scaffolding
#
# Compute: Lakeflow pipelines → shared instance pool jcp1 (autoscale 1–3, Dedicated SP).
# Recon uses fixed single-node j2 from cluster_config.json (recon_cluster_tier).
# =============================================================================
bundle:
  name: ipac-delta-sync
  engine: direct

experimental:
  skip_name_prefix_for_schema: true

sync:
  include:
    - src/common/notebooks/**
    - src/common/ops/**
    - generated/config/**

include:
  - generated/config/schema/*.yml
  - generated/bundle/*.yml
  - resources/jobs/*.yml

variables:
  uc_catalog:
    default: dev7
  dest_schema_suffix:
    default: "_poc_1"
  ipac_metadata_schema:
    default: ipac_metadata
  grant_group:
    default: ipacs_dev_team
  heartbeat_interval_sec:
    default: 900
  recon_poll_interval_sec:
    default: 30
  heartbeat_job_alert_mail:
    default: mukessingh@deloitte.com
  num_of_tables_in_pipeline:
    default: 220
  pipeline_tag:
    default: ipac_delta_sync
  job_tag:
    default: ipac_delta_sync
  pipeline_max_update_retry_attempts:
    default: 2
  pipeline_spark_version:
    default: 15.4.x-scala2.12
  pipeline_cluster_num_workers:
    default: 0
  recon_cluster_tier:
    default: j2
  # Service principal application (client) ID for Dedicated pipeline/recon clusters.
  lakeflow_single_user:
    default: ""
  pipeline_data_security_mode:
    default: DATA_SECURITY_MODE_DEDICATED
  pipeline_use_instance_pool:
    default: true
  instance_pool_node_type_id:
    default: Standard_D8s_v3
  instance_pool_min_idle_instances:
    default: 3
  instance_pool_max_capacity:
    default: 30
  pipeline_cluster_autoscale_min:
    default: 3
  pipeline_cluster_autoscale_max:
    default: 5

targets:
  dev:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Shared/ipac_delta_sync/dev
    presets:
      pipelines_development: false
    variables:
      uc_catalog: dev7
      dest_schema_suffix: "_poc_1"
      ipac_metadata_schema: ipac_metadata
      grant_group: ipacs_dev_team
      heartbeat_interval_sec: 900
      recon_poll_interval_sec: 30
      heartbeat_job_alert_mail: mukessingh@deloitte.com
      pipeline_tag: ipac_delta_sync
      job_tag: ipac_delta_sync
      pipeline_max_update_retry_attempts: 2
      num_of_tables_in_pipeline: 220
      recon_cluster_tier: j2
      pipeline_cluster_num_workers: 0

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/ipac_delta_sync/prod
    variables:
      uc_catalog: ipac_tax_synch
      dest_schema_suffix: "_poc1"
      ipac_metadata_schema: ipac_metadata
      grant_group: ipacs_dev_team
      heartbeat_interval_sec: 900
      recon_poll_interval_sec: 30
      heartbeat_job_alert_mail: mukessingh@deloitte.com
      pipeline_tag: ipac_delta_sync
      job_tag: ipac_delta_sync
      pipeline_max_update_retry_attempts: 2
      num_of_tables_in_pipeline: 220
      recon_cluster_tier: j2
      pipeline_cluster_num_workers: 0
